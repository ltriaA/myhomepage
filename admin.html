<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>语料管理 · 张小衡数字分身</title>
<style>
  :root {
    --wine: #8a1e3f;
    --wine-dark: #6b1530;
    --wine-soft: #e6c9d3;
    --cream: #f7efe9;
    --ink: #2f2a2b;
    --muted: #8a7f82;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 18px 64px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      linear-gradient(to top, rgba(196,40,40,.45) 0%, rgba(196,40,40,.20) 40%, rgba(251,247,244,1) 90%) fixed;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; color: var(--wine); margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .card {
    background: var(--white);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(138,30,63,.10);
    margin-bottom: 18px;
    border: 1px solid rgba(138,30,63,.08);
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--wine-dark); }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--wine-soft);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fffdfc;
    color: var(--ink);
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--wine); }
  textarea { resize: vertical; min-height: 76px; line-height: 1.6; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row > * { flex: 1; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    background: var(--wine);
    color: #fff;
    transition: .18s;
  }
  button:hover { background: var(--wine-dark); transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  button.ghost { background: transparent; color: var(--wine); border: 1.5px solid var(--wine-soft); }
  button.ghost:hover { background: var(--cream); }
  button.del { background: transparent; color: #b03030; border: 1.5px solid #f0c9c9; padding: 6px 12px; font-size: 12px; }
  button.del:hover { background: #fdf2f2; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1.5px solid var(--wine-soft); color: var(--wine); background: transparent;
  }
  .tab.active { background: var(--wine); color: #fff; border-color: var(--wine); }
  .item {
    border: 1px solid #f0e4e8; border-radius: 12px; padding: 12px 14px;
    margin-bottom: 10px; background: #fffaf9; display: flex; gap: 12px; align-items: flex-start;
  }
  .item .body { flex: 1; min-width: 0; }
  .q { font-weight: 600; font-size: 13px; color: var(--wine-dark); margin-bottom: 4px; word-break: break-word; }
  .a { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--cream); color: var(--wine); margin-right: 6px; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; color: var(--muted); }
  .status.ok { color: #1f7a45; }
  .status.err { color: #b03030; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 8px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>数字分身 · 语料管理</h1>
  <p class="sub">这里录入的内容会实时影响主页数字分身的回答风格，无需重新部署。</p>

  <!-- 口令 -->
  <div class="card" id="authCard">
    <label for="token">管理口令</label>
    <div class="row">
      <input id="token" type="password" placeholder="输入 ADMIN_TOKEN" autocomplete="current-password" />
      <button id="saveToken" style="flex:0 0 auto">进入</button>
    </div>
    <div class="status" id="authStatus"></div>
  </div>

  <div id="panel" class="hidden">
    <!-- 添加 -->
    <div class="card">
      <label for="kind">类型</label>
      <select id="kind">
        <option value="qa">问答对（访客问 → 你的真实回答）</option>
        <option value="style">说话风格（你真实说过的一句话）</option>
        <option value="fact">事实（关于你的一条信息）</option>
      </select>

      <div id="qWrap" style="margin-top:12px">
        <label for="question">访客的问题</label>
        <input id="question" placeholder="例如：你最近在忙什么？" />
      </div>

      <div style="margin-top:12px">
        <label for="answer">你的回答 / 内容</label>
        <textarea id="answer" placeholder="尽量用你本人真实的说法，越口语越好"></textarea>
      </div>

      <div style="margin-top:14px">
        <button id="addBtn">添加一条</button>
        <span class="status" id="addStatus"></span>
      </div>
    </div>

    <!-- 批量导入 -->
    <div class="card">
      <label for="bulk">批量导入</label>
      <textarea id="bulk" style="min-height:120px" placeholder="问答对格式（每行一条）：问题 ||| 你的回答&#10;风格/事实格式（每行一条）：直接写内容"></textarea>
      <p class="hint">
        导入时先在上方「类型」里选好，再点下面的按钮。<br />
        问答对用 <code>|||</code> 分隔问题和回答；风格和事实每行一条。
      </p>
      <div style="margin-top:10px">
        <button class="ghost" id="bulkBtn">批量导入</button>
        <span class="status" id="bulkStatus"></span>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-kind="qa">问答对</div>
        <div class="tab" data-kind="style">说话风格</div>
        <div class="tab" data-kind="fact">事实</div>
      </div>
      <div id="list"><div class="empty">加载中…</div></div>
      <div class="status" id="listStatus"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://mjfyfmiwegvsmhibfrir.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZnlmbWl3ZWd2c21oaWJmcmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDU2MTksImV4cCI6MjEwNTQ4MTYxOX0.L05VFzAwgp3praHCjH5i2LlQyPuAb6LxFmSTy1nZOOk";
  const ENDPOINT = SUPABASE_URL + "/functions/v1/persona-admin";
  const TOKEN_KEY = "zhx_admin_token";

  const $ = (id) => document.getElementById(id);
  let currentKind = "qa";

  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} }

  function say(el, msg, ok) {
    el.textContent = msg;
    el.className = "status" + (ok === true ? " ok" : ok === false ? " err" : "");
  }

  // 边界函数刚部署/冷启动时可能短暂不可达，这里做有限重试
  async function api(method, body, query, retries) {
    if (retries == null) retries = 2;
    const payload = body ? JSON.stringify(body) : undefined;
    let lastErr = null;

    for (let attempt = 0; attempt <= retries; attempt++) {
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 90000);
      try {
        const r = await fetch(ENDPOINT + (query || ""), {
          method,
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
            "x-admin-token": getToken()
          },
          body: payload,
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const data = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          // 4xx 属于请求本身有问题，重试无意义
          if (r.status >= 400 && r.status < 500) {
            throw new Error(data.error || ("HTTP " + r.status));
          }
          throw new Error(data.error || ("HTTP " + r.status));
        }
        return data;
      } catch (e) {
        clearTimeout(timer);
        lastErr = e;
        const msg = String(e && e.message || e);
        // 口令错误 / 4xx 不重试
        if (msg.indexOf("口令") !== -1 || /^HTTP 4/.test(msg)) throw e;
        if (attempt < retries) {
          await new Promise(function (res) { setTimeout(res, 900 * (attempt + 1)); });
        }
      }
    }
    throw lastErr || new Error("网络不可达");
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  async function loadList() {
    const listEl = $("list");
    say($("listStatus"), "");
    try {
      const data = await api("GET", null, "?kind=" + currentKind);
      const items = data.items || [];
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">还没有内容，先在上面添加一条吧</div>';
        return;
      }
      listEl.innerHTML = items.map(function (it) {
        return '<div class="item">' +
          '<div class="body">' +
          (it.question ? '<div class="q">Q：' + esc(it.question) + '</div>' : '') +
          '<div class="a">' + esc(it.answer) + '</div>' +
          (it.tags && it.tags.length ? '<div style="margin-top:8px">' + it.tags.map(function (t) {
            return '<span class="tag">' + esc(t) + '</span>';
          }).join("") + '</div>' : '') +
          '</div>' +
          '<button class="del" data-id="' + esc(it.id) + '">删除</button>' +
          '</div>';
      }).join("");
      listEl.querySelectorAll(".del").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          if (!confirm("确定删除这条语料？")) return;
          btn.disabled = true;
          try {
            await api("DELETE", null, "?id=" + encodeURIComponent(btn.dataset.id));
            loadList();
          } catch (e) {
            say($("listStatus"), "删除失败：" + e.message, false);
            btn.disabled = false;
          }
        });
      });
    } catch (e) {
      say($("listStatus"), "加载失败：" + e.message, false);
      listEl.innerHTML = '<div class="empty">加载失败</div>';
    }
  }

  // 口令
  $("saveToken").addEventListener("click", async function () {
    const v = $("token").value.trim();
    if (!v) { say($("authStatus"), "请输入口令", false); return; }
    setToken(v);
    say($("authStatus"), "验证中…");
    try {
      await api("GET", null, "?kind=qa");
      say($("authStatus"), "口令正确", true);
      $("authCard").classList.add("hidden");
      $("panel").classList.remove("hidden");
      loadList();
    } catch (e) {
      say($("authStatus"), "验证失败：" + e.message, false);
    }
  });

  $("token").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("saveToken").click();
  });

  // 类型切换
  $("kind").addEventListener("change", function () {
    const isQa = $("kind").value === "qa";
    $("qWrap").style.display = isQa ? "block" : "none";
  });

  // 添加
  $("addBtn").addEventListener("click", async function () {
    const kind = $("kind").value;
    const question = $("question").value.trim();
    const answer = $("answer").value.trim();
    if (!answer) { say($("addStatus"), "内容不能为空", false); return; }
    if (kind === "qa" && !question) { say($("addStatus"), "问答对需要填问题", false); return; }
    $("addBtn").disabled = true;
    try {
      await api("POST", { kind, question: kind === "qa" ? question : null, answer });
      say($("addStatus"), "已添加", true);
      $("answer").value = "";
      if (kind === "qa") $("question").value = "";
      if (kind !== currentKind) {
        currentKind = kind;
        document.querySelectorAll(".tab").forEach(function (t) {
          t.classList.toggle("active", t.dataset.kind === kind);
        });
      }
      loadList();
    } catch (e) {
      say($("addStatus"), "添加失败：" + e.message, false);
    }
    $("addBtn").disabled = false;
  });

  // 批量导入
  $("bulkBtn").addEventListener("click", async function () {
    const kind = $("kind").value;
    const lines = $("bulk").value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) { say($("bulkStatus"), "没有内容", false); return; }
    const items = [];
    for (const line of lines) {
      if (kind === "qa") {
        const parts = line.split("|||");
        if (parts.length < 2) continue;
        items.push({ kind: "qa", question: parts[0].trim(), answer: parts.slice(1).join("|||").trim() });
      } else {
        items.push({ kind: kind, answer: line });
      }
    }
    if (!items.length) {
      say($("bulkStatus"), kind === "qa" ? "格式不对，应为：问题 ||| 回答" : "没有有效内容", false);
      return;
    }
    $("bulkBtn").disabled = true;
    try {
      // 分批提交：单批 50 条，避免大请求体和单点失败
      const BATCH = 50;
      let inserted = 0;
      for (let i = 0; i < items.length; i += BATCH) {
        const chunk = items.slice(i, i + BATCH);
        say($("bulkStatus"), "导入中… " + inserted + "/" + items.length);
        const res = await api("POST", { items: chunk });
        inserted += (res && res.inserted) || chunk.length;
      }
      say($("bulkStatus"), "成功导入 " + inserted + " 条", true);
      $("bulk").value = "";
      if (kind !== currentKind) {
        currentKind = kind;
        document.querySelectorAll(".tab").forEach(function (t) {
          t.classList.toggle("active", t.dataset.kind === kind);
        });
      }
      loadList();
    } catch (e) {
      const msg = String(e && e.message || e);
      say($("bulkStatus"), msg === "Failed to fetch"
        ? "导入失败：网络请求未送达，请检查网络后重试（已自动重试 2 次）"
        : "导入失败：" + msg, false);
    }
    $("bulkBtn").disabled = false;
  });

  // tab
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      currentKind = tab.dataset.kind;
      loadList();
    });
  });

  // 自动恢复会话
  if (getToken()) {
    $("token").value = getToken();
    $("saveToken").click();
  }
</script>
</body>
</html>
